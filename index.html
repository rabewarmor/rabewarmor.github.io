<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rabewar Moradi | Terminal Portfolio</title>
  <meta name="description" content="Terminal-style resume and portfolio of Rabewar Moradi, Computer Engineering (Software Co-op) at the University of Alberta." />
  <link rel="stylesheet" href="content/css/styles.css" />
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span class="topbar-dots" aria-hidden="true">
        <i class="dot dot-red"></i><i class="dot dot-yellow"></i><i class="dot dot-green"></i>
      </span>
      <span class="topbar-title">visitor@rabewar: ~</span>
      <span class="topbar-actions">
        <button type="button" class="theme-btn" data-theme-set="dark">dark</button>
        <button type="button" class="theme-btn" data-theme-set="light">light</button>
        <button type="button" class="theme-btn" data-theme-set="matrix">matrix</button>
        <button type="button" class="theme-btn" data-theme-set="ubuntu">ubuntu</button>
        <button type="button" class="theme-btn" data-theme-set="amber">amber</button>
      </span>
    </div>
  </div>

  <header class="site-header">
    <h1 class="banner-name">Rabewar Moradi</h1>
    <div class="banner-rule"></div>
    <p class="tagline">Computer Engineering (Software Co-op) · University of Alberta · Edmonton, AB</p>

    <nav class="site-nav" aria-label="Quick commands">
      <button type="button" class="nav-cmd" data-cmd="about">about</button>
      <button type="button" class="nav-cmd" data-cmd="experience">experience</button>
      <button type="button" class="nav-cmd" data-cmd="projects">projects</button>
      <button type="button" class="nav-cmd" data-cmd="skills">skills</button>
      <button type="button" class="nav-cmd" data-cmd="education">education</button>
      <button type="button" class="nav-cmd" data-cmd="socials">socials</button>
      <a class="nav-cmd nav-link" href="content/pdf/resume.pdf" target="_blank" rel="noopener">resume.pdf ↗</a>
    </nav>

    <p class="meta">
      <a href="mailto:rabewar@ualberta.ca">rabewar@ualberta.ca</a> ·
      <a href="https://github.com/rabewarmor" target="_blank" rel="noopener">GitHub</a> ·
      <a href="https://linkedin.com/in/rabewar-moradi-851544340" target="_blank" rel="noopener">LinkedIn</a>
    </p>
  </header>
  
  <main id="terminal" class="terminal">
    <div id="output" class="output"></div>

    <form id="cmd-form" class="cmd-form" autocomplete="off">
      <label class="prompt" for="cmd-input">
        <span class="prompt-user">visitor</span><span class="prompt-at">@</span><span class="prompt-host">rabewar</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span class="prompt-sym">$</span>
      </label>
      <input
        id="cmd-input"
        class="cmd-input"
        type="text"
        name="command"
        spellcheck="false"
        autocapitalize="off"
        autocorrect="off"
        aria-label="Terminal command input"
      />
    </form>
  </main>

  <noscript>
    <div class="noscript">
      <h1>Rabewar Moradi</h1>
      <p>Computer Engineering (Software Co-op) — University of Alberta, Edmonton AB</p>
      <p>
        <a href="mailto:rabewar@ualberta.ca">rabewar@ualberta.ca</a> ·
        <a href="https://github.com/rabewarmor">GitHub</a> ·
        <a href="https://linkedin.com/in/rabewar-moradi-851544340">LinkedIn</a> ·
        <a href="content/pdf/resume.pdf">Resume (PDF)</a>
      </p>
      <p>This site is interactive and requires JavaScript. The PDF resume above works without it.</p>
    </div>
  </noscript>

  <script src="content/js/data.js"></script>
  <script src="content/js/terminal.js"></script>
</body>
</html>

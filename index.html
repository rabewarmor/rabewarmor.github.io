<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rabewar Moradi | Terminal Portfolio</title>
  <meta name="description" content="Terminal-style resume and portfolio of Rabewar Moradi, Computer Engineering (Software Co-op) at the University of Alberta." />
  <link rel="stylesheet" href="content/css/styles.css" />
</head>

<body>
  <main id="terminal" class="terminal">
    <div id="output" class="output"></div>

    <form id="cmd-form" class="cmd-form" autocomplete="off">
      <label class="prompt" for="cmd-input">
        <span class="prompt-user">visitor</span><span class="prompt-at">@</span><span class="prompt-host">rabewar</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span class="prompt-sym">$</span>
      </label>
      <input
        id="cmd-input"
        class="cmd-input"
        type="text"
        name="command"
        spellcheck="false"
        autocapitalize="off"
        autocorrect="off"
        aria-label="Terminal command input"
      />
    </form>
  </main>

  <noscript>
    <div class="noscript">
      <h1>Rabewar Moradi</h1>
      <p>Computer Engineering (Software Co-op) — University of Alberta, Edmonton AB</p>
      <p>
        <a href="mailto:rabewar@ualberta.ca">rabewar@ualberta.ca</a> ·

      </p>
      <p>This site is interactive and requires JavaScript. The PDF resume above works without it.</p>
    </div>
  </noscript>

  <script src="content/js/data.js"></script>
  <script src="content/js/terminal.js"></script>
</body>
</html>

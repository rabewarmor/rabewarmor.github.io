<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rabewar Moradi | Terminal Portfolio</title>

  <link rel="stylesheet" href="content/css/styles.css" />

<body>
  <header class="wrap site-header">
    <h1 class="banner-name">Rabewar Moradi</h1>
    <p class="tagline">Computer Engineering (Software Co-op)</p>
    <p class="tagline"> University of Alberta · Edmonton, AB</p>
    <p class="meta">
      <a href="mailto:rabewar@ualberta.ca">rabewar@ualberta.ca</a> ·

  <main id="terminal" class="wrap terminal">
    <div id="output" class="output"></div>
    <form id="cmd-form" class="cmd-form" autocomplete="off">
      <label class="prompt" for="cmd-input">
        <span class="p-user">visitor</span><span class="p-dim">@</span><span class="p-host">rabewar</span><span class="p-dim">:</span><span class="p-path">~</span><span class="p-dim">$</span>
      </label>
      <input id="cmd-input" class="cmd-input" type="text" spellcheck="false"
             autocapitalize="off" autocorrect="off" aria-label="Terminal command input" />
    </form>
  </main>

  <nav class="wrap tiles" aria-label="Sections">
    <a class="tile" href="about.html"      style="--img:url('content/img/about.jpg')"><span class="tile-label">about</span></a>
    <a class="tile" href="experience.html" style="--img:url('content/img/experience.jpg')"><span class="tile-label">experience</span></a>
